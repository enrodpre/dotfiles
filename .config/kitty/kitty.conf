# vim:ft=kitty
# shell disabled

enable_audio_bell no

scrollback_pager lthemesess --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

enabled_layouts splits:split_axis=vertical,stack
draw_minimal_borders yes

include mapping.conf
include themes/tokyonight_night.conf

font_family MesloLGM Nerd Font Mono
font_family family="Fira code" style="Retina" features="-liga -dlig -calt"
font_size 14
# narrow_symbols codepoint
